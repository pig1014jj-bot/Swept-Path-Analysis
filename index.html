<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swept Path Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #000; cursor: pointer; margin-top: -5px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex h-screen text-gray-900 overflow-hidden bg-white selection:bg-blue-200">
    <!-- Sidebar -->
    <aside class="w-[380px] bg-white border-r border-gray-200 shadow-xl flex flex-col z-20 shrink-0 relative">
        <div class="flex justify-between items-center px-5 py-4 bg-gray-50 border-b border-gray-200 shrink-0">
            <div class="flex items-center gap-2">
                <div class="bg-black text-white text-[11px] font-black w-7 h-7 rounded flex items-center justify-center">SP</div>
                <div class="text-lg font-black tracking-tighter uppercase leading-none mt-1">Swept Path <span class="text-[9px] text-blue-600 bg-blue-100 px-1 rounded ml-1 align-top">Analysis</span></div>
            </div>
            <div class="flex gap-2">
                <select id="lang" class="text-xs font-bold bg-white border border-gray-300 px-2 py-1 rounded outline-none cursor-pointer">
                    <option value="zh">TW</option>
                    <option value="ja">JP</option>
                    <option value="en">EN</option>
                </select>
                <button onclick="window.toggleInfo()" class="p-1"><i data-lucide="info" class="w-4 h-4"></i></button>
            </div>
        </div>
        <div class="flex w-full bg-gray-50 text-gray-500 border-b border-gray-200 shrink-0">
            <button onclick="tab('map')" id="tb-map" class="flex-1 py-3 flex flex-col items-center gap-1 border-b-2 bg-white text-black border-black font-bold"><i data-lucide="map" class="w-4 h-4"></i><span class="text-[10px]" data-i18n="s1">1. 底圖</span></button>
            <button onclick="tab('veh')" id="tb-veh" class="flex-1 py-3 flex flex-col items-center gap-1 border-b-2 border-transparent hover:bg-gray-100"><i data-lucide="car" class="w-4 h-4"></i><span class="text-[10px]" data-i18n="s2">2. 車輛</span></button>
            <button onclick="tab('lyr')" id="tb-lyr" class="flex-1 py-3 flex flex-col items-center gap-1 border-b-2 border-transparent hover:bg-gray-100"><i data-lucide="layers" class="w-4 h-4"></i><span class="text-[10px]" data-i18n="s3">3. 軌跡</span></button>
        </div>
        
        <!-- Panels -->
        <div class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4">
            
            <!-- Map Panel -->
            <div id="p-map" class="space-y-4 animate-in fade-in">
                <label class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 hover:border-black cursor-pointer transition group">
                    <i data-lucide="upload" class="w-6 h-6 mb-2 text-gray-400 group-hover:text-black"></i>
                    <span class="font-bold text-xs" id="up-txt" data-i18n="load">匯入 圖片/PDF/DXF</span>
                    <input type="file" id="f-up" accept="image/*,.pdf,.dxf" class="hidden"/>
                </label>
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                    <button id="b-cal" class="w-full py-2 bg-black text-white rounded-lg font-bold text-xs flex justify-center gap-2"><i data-lucide="scaling" class="w-3.5 h-3.5"></i> <span data-i18n="cal">測量圖面尺寸</span></button>
                    <button id="b-anc" class="w-full py-2 bg-white border border-gray-300 rounded-lg font-bold text-xs flex justify-center gap-2"><i data-lucide="target" class="w-3.5 h-3.5"></i> <span data-i18n="anc">設 DXF 錨點 (0,0)</span></button>
                </div>
                <button id="b-rst" class="w-full py-2 bg-red-50 text-red-600 rounded-lg font-bold text-xs flex justify-center gap-2 border border-red-200"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> <span data-i18n="clr">清除全部</span></button>
            </div>
            
            <!-- Vehicle Panel -->
            <div id="p-veh" class="hidden space-y-4 animate-in fade-in">
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                    <select id="preset" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1.5 text-xs font-bold outline-none"></select>
                    <div class="flex gap-2">
                        <button id="b-sav-c" class="flex-1 py-1.5 border border-gray-300 text-xs font-bold rounded flex justify-center gap-1"><i data-lucide="save" class="w-3 h-3"></i> <span data-i18n="svCus">儲存自訂</span></button>
                        <button id="b-del-c" class="px-2 bg-red-50 text-red-600 rounded hidden"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                    <h3 class="text-xs font-bold border-b pb-2 flex gap-1"><i data-lucide="settings-2" class="w-3.5 h-3.5"></i> <span data-i18n="bp">車身參數</span></h3>
                    <div id="v-params" class="space-y-2"></div>
                </div>
                <div id="t-sect" class="bg-blue-50 p-4 rounded-xl border border-blue-100 shadow-sm space-y-3 hidden">
                    <h3 class="text-xs font-bold text-blue-900 border-b border-blue-200 pb-2 flex gap-1"><i data-lucide="truck" class="w-3.5 h-3.5"></i> <span data-i18n="tp">尾車參數</span></h3>
                    <div id="t-params" class="space-y-2"></div>
                </div>
            </div>
            
            <!-- Layers Panel -->
            <div id="p-lyr" class="hidden space-y-4 animate-in fade-in">
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                    <button id="b-plc" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-black text-xs flex justify-center gap-2 transition shadow-sm"><i data-lucide="map-pin" class="w-4 h-4"></i> <span data-i18n="plc">畫布上放置車輛</span></button>
                    <div id="colors" class="flex gap-2 justify-between pt-3 border-t border-gray-100"></div>
                    <div id="d-params" class="space-y-2 pt-3 border-t border-gray-100"></div>
                </div>
                <button id="b-sav-p" class="w-full py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs flex justify-center gap-2"><i data-lucide="save" class="w-3.5 h-3.5"></i> <span data-i18n="svp">保存軌跡至圖層</span></button>
                <button id="b-adv" class="w-full py-2 mt-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs flex justify-center gap-2"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> 多節點路徑</button>
                <button id="b-gen" class="w-full py-2 mt-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex justify-center gap-2 hidden"><i data-lucide="play" class="w-3.5 h-3.5"></i> 生成最佳路徑</button>
                <button id="b-cancel-adv" class="w-full py-2 mt-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-xs flex justify-center gap-2 hidden"><i data-lucide="x" class="w-3.5 h-3.5"></i> 取消</button>
                <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold" data-i18n="lyrs">圖層</span>
                        <span id="l-cnt" class="bg-gray-100 px-2 rounded-full text-[10px] font-bold">0</span>
                    </div>
                    <div id="l-list" class="space-y-1 max-h-48 overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>
            
        </div>
        <div class="py-3 text-center opacity-40 text-[9px] font-bold tracking-widest text-gray-500 uppercase pointer-events-none">Developed by Wu Chieh Chun</div>
    </aside>

    <!-- Main Canvas Area -->
    <div class="flex-1 relative overflow-hidden bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] bg-gray-50" style="background-size:20px 20px;">
        <div id="cv-wrap" class="absolute inset-0 cursor-grab active:cursor-grabbing">
            <canvas id="cv" class="block w-full h-full"></canvas>
        </div>
        
        <!-- Top Right Floating Tools -->
        <div class="absolute top-5 right-5 z-10 flex gap-2">
            <input type="file" id="f-load" accept=".json" class="hidden" />
            <div class="flex bg-white/90 backdrop-blur rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button id="b-undo" class="px-3 py-2 text-gray-500 hover:text-black hover:bg-gray-50 border-r border-gray-100 disabled:opacity-30 disabled:cursor-not-allowed" disabled><i data-lucide="undo" class="w-4 h-4"></i></button>
                <button id="b-redo" class="px-3 py-2 text-gray-500 hover:text-black hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed" disabled><i data-lucide="redo" class="w-4 h-4"></i></button>
            </div>
            <div class="flex bg-white/90 backdrop-blur rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button id="b-load" class="px-3 py-2 text-xs font-bold text-gray-700 hover:text-black hover:bg-gray-50 flex items-center gap-1.5 border-r border-gray-100"><i data-lucide="folder-open" class="w-3.5 h-3.5"></i> <span data-i18n="loadCfg">讀取</span></button>
                <button id="b-save" class="px-3 py-2 text-xs font-bold text-gray-700 hover:text-black hover:bg-gray-50 flex items-center gap-1.5 border-r border-gray-100"><i data-lucide="save" class="w-3.5 h-3.5"></i> <span data-i18n="saveCfg">存檔</span></button>
                <button id="b-exp" class="px-3 py-2 text-xs font-bold text-gray-700 hover:text-black hover:bg-gray-50 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> <span data-i18n="exp">匯出 DXF</span></button>
            </div>
        </div>
        
        <div class="absolute bottom-6 right-6 z-10 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col">
            <button onclick="window.zm(1.2)" class="p-2 hover:bg-gray-50 border-b"><i data-lucide="plus" class="w-4 h-4"></i></button>
            <button onclick="window.rstZm()" class="p-2 hover:bg-gray-50 border-b"><i data-lucide="maximize" class="w-4 h-4"></i></button>
            <button onclick="window.zm(1/1.2)" class="p-2 hover:bg-gray-50"><i data-lucide="minus" class="w-4 h-4"></i></button>
        </div>
        
        <div class="absolute bottom-6 left-6 z-20 flex flex-col-reverse items-start gap-2">
            <button onclick="window.tgSop()" id="b-sop" class="flex gap-1.5 px-3 py-2 rounded-xl shadow-sm border text-xs font-bold bg-white/90">
                <i data-lucide="keyboard" class="w-3.5 h-3.5"></i><span id="t-sop" data-i18n="opT">操作提示</span>
            </button>
            <div id="p-sop" class="hidden bg-white/95 p-4 rounded-xl shadow-xl border w-56 text-xs">
                <div class="font-bold border-b pb-2 mb-2 flex justify-between">
                    <span data-i18n="ht">鍵盤滑鼠操作</span>
                    <button onclick="window.tgSop()"><i data-lucide="x" class="w-3 h-3"></i></button>
                </div>
                <ul class="space-y-2 text-gray-600 font-medium">
                    <li class="flex justify-between"><span>駕駛</span><kbd class="bg-gray-100 px-1 rounded text-[10px] text-black">W A S D</kbd></li>
                    <li class="flex justify-between"><span>縮放</span><kbd class="bg-gray-100 px-1 rounded text-[10px] text-black">滾輪</kbd></li>
                    <li class="flex justify-between"><span>平移</span><kbd class="bg-gray-100 px-1 rounded text-[10px] text-black">拖曳空白</kbd></li>
                </ul>
            </div>
        </div>
        
        <div id="dyn-ov" class="hidden absolute top-8 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 z-50 pointer-events-none"></div>
        
        <div id="m-info" class="fixed inset-0 z-50 bg-black/20 backdrop-blur-sm hidden flex items-center justify-center" onpointerdown="window.toggleInfo()">
            <div class="bg-white p-6 rounded-2xl shadow-2xl border w-80 relative" onpointerdown="event.stopPropagation()">
                <button onclick="window.toggleInfo()" class="absolute top-3 right-3 text-gray-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                <div class="flex items-center gap-2 mb-3 border-b pb-2">
                    <div class="bg-black text-white p-1.5 rounded"><i data-lucide="info" class="w-4 h-4"></i></div>
                    <h2 class="text-sm font-black">關於此工具</h2>
                </div>
                <div class="text-xs text-gray-600 space-y-1">
                    <p>車輛軌跡模擬工具，用於建築前期規劃檢討。</p>
                    <p>支援 DXF/PDF 底圖，可直接匯出至 AutoCAD。</p>
                </div>
                <div class="mt-4 pt-2 border-t text-right text-[9px] font-bold text-gray-400 uppercase tracking-widest">by Wu Chieh Chun</div>
            </div>
        </div>
    </div>

    <script>
        const I18N = {
            zh: {s1:"1. 底圖",s2:"2. 車輛",s3:"3. 軌跡",load:"匯入 圖片/PDF/DXF",cal:"測量圖面尺寸",anc:"設 DXF 錨點 (0,0)",clr:"清除全部",svCus:"儲存自訂",bp:"車身參數",length:"車身長度",width:"車身寬度",wheelbase:"軸距",rearOverhang:"後懸",tp:"尾車參數",trailerLength:"尾車長度",trailerWheelbase:"尾車軸距",trailerRearOverhang:"尾車後懸",hitchOffset:"第五輪偏移(Hitch)",plc:"畫布上放置車輛",maxSpeed:"最高速(km/h)",stampInterval:"描繪間距(mm)",svp:"保存軌跡至圖層",lyrs:"圖層",exp:"匯出 DXF",loadCfg:"讀取",saveCfg:"存檔",lSucc:"✅ 讀取成功！",opT:"操作提示",ht:"鍵盤滑鼠操作",mPlc:"點擊設定「車輛起點」",mRot:"滑鼠設定「方向」，點擊確認",mAnc:"點擊一點作 DXF 原點",mC1:"點擊「標註起點」",mC2:"點擊「標註終點」",noL:"無圖層",pd:"-- 選擇車型 --",std:"標準車型",cus:"自訂車型",alertA:"錨點已設！",alertN:"無軌跡可保存！",alertE:"無軌跡可匯出！",pDist:"輸入實際距離 (mm)",aCalD:"DXF 比例尺已校正！",aCalM:"比例尺校正完成！",pCus:"自訂名稱：",car:"一般車",truck2t:"小卡(2t)",truck4t:"中卡(4t)",truck10t:"大卡(10t)",truck25t:"特大(25t)",semi:"半聯結車"},
            ja: {s1:"1. 背景",s2:"2. 車両",s3:"3. 軌跡",load:"画像/PDF/DXF読込",cal:"実寸を測定",anc:"アンカー(0,0)",clr:"全てクリア",svCus:"カスタム保存",bp:"基本パラメータ",length:"全長",width:"全幅",wheelbase:"ホイールベース",rearOverhang:"リアオーバーハング",tp:"トレーラー設定",trailerLength:"トレーラー長",trailerWheelbase:"T-ホイールベース",trailerRearOverhang:"T-リアオーバーハング",hitchOffset:"カプラオフセット",plc:"車両を配置",maxSpeed:"最高速度(km/h)",stampInterval:"描画間隔(mm)",svp:"軌跡を保存",lyrs:"レイヤー",exp:"DXF出力",loadCfg:"読込",saveCfg:"保存",lSucc:"✅ 読込成功！",opT:"操作ヒント",ht:"操作方法",mPlc:"図面をクリックして「初期位置」を設定",mRot:"マウスで「向き」を設定しクリック",mAnc:"DXF原点(0,0)をクリック",mC1:"「寸法の始点」をクリック",mC2:"「寸法の終点」をクリック",noL:"レイヤーなし",pd:"-- 選択 --",std:"標準",cus:"カスタム",alertA:"アンカー設定完了！",alertN:"軌跡がありません！",alertE:"出力データがありません！",pDist:"実距離を入力(mm)",aCalD:"DXFスケール補正！",aCalM:"スケール補正完了！",pCus:"名前を入力：",car:"乗用車",truck2t:"2tトラック",truck4t:"4tトラック",truck10t:"10tトラック",truck25t:"25tトラック",semi:"セミトレーラー"},
            en: {s1:"1. Map",s2:"2. Vehicle",s3:"3. Paths",load:"Import Image/PDF/DXF",cal:"Measure Scale",anc:"Set Anchor (0,0)",clr:"Clear All",svCus:"Save Custom",bp:"Body Params",length:"Length",width:"Width",wheelbase:"Wheelbase",rearOverhang:"Rear Overhang",tp:"Trailer",trailerLength:"T-Length",trailerWheelbase:"T-Wheelbase",trailerRearOverhang:"T-Rear Overhang",hitchOffset:"Hitch Offset",plc:"Place Vehicle",maxSpeed:"Max Speed(km/h)",stampInterval:"Stamp Dist(mm)",svp:"Save Path",lyrs:"Layers",exp:"Export DXF",loadCfg:"Load",saveCfg:"Save",lSucc:"✅ Load Success!",opT:"Controls",ht:"Keyboard/Mouse",mPlc:"Click to set start pos",mRot:"Move to set direction, click to confirm",mAnc:"Click to set DXF anchor",mC1:"Click dimension start",mC2:"Click dimension end",noL:"No layers",pd:"-- Select --",std:"Standard",cus:"Custom",alertA:"Anchor set!",alertN:"No path to save!",alertE:"No path to export!",pDist:"Enter actual dist (mm)",aCalD:"DXF scaled!",aCalM:"Scale calibrated!",pCus:"Custom Name:",car:"Car",truck2t:"Truck(2t)",truck4t:"Truck(4t)",truck10t:"Truck(10t)",truck25t:"Truck(25t)",semi:"Semi-Trailer"}
        };
        let cLang = 'zh';
        const t = k => I18N[cLang][k] || k;
        let isSop = false;
        let isInf = false;

        const PRESETS = [
            {id:'car',length:4800,width:1800,wheelbase:2800,rearOverhang:1000,rearAxles:1,rearAxleSpacing:0,hasTrailer:false,hitchOffset:0},
            {id:'truck2t',length:4700,width:1700,wheelbase:2500,rearOverhang:1100,rearAxles:1,rearAxleSpacing:0,hasTrailer:false,hitchOffset:0},
            {id:'truck4t',length:8600,width:2300,wheelbase:4900,rearOverhang:2400,rearAxles:1,rearAxleSpacing:0,hasTrailer:false,hitchOffset:0},
            {id:'truck10t',length:11900,width:2500,wheelbase:6500,rearOverhang:3200,rearAxles:2,rearAxleSpacing:1300,hasTrailer:false,hitchOffset:0},
            {id:'truck25t',length:11990,width:2490,wheelbase:7100,rearOverhang:3200,rearAxles:3,rearAxleSpacing:1300,hasTrailer:false,hitchOffset:0},
            {id:'semi',length:6505,width:2480,wheelbase:3605,rearOverhang:1400,rearAxles:2,rearAxleSpacing:1300,hasTrailer:true,trailerLength:11990,trailerWidth:2480,trailerWheelbase:8705,trailerRearOverhang:2070,trailerFrontOverhang:1215,hitchOffset:300,trailerAxles:3,trailerAxleSpacing:1300}
        ];
        
        const CLRS = [
            {id:1,h:'#ef4444'}, {id:2,h:'#eab308'}, {id:3,h:'#22c55e'}, 
            {id:4,h:'#06b6d4'}, {id:5,h:'#3b82f6'}, {id:6,h:'#d946ef'}, {id:7,h:'#1e293b'}
        ];
        
        let bgImg = null;
        let dxfD = null;
        let dxfSc = 1;
        let carCfg = {...PRESETS[0], maxSteer:0.6, maxSpeed:80, acceleration:2, friction:1, steerSpeed:0.02, mmPerPx:50, stampInterval:500, stampAngleInterval:2};
        
        let paths = [];
        let cusPre = [];
        let selPre = 'car';
        let curCol = 5;
        let ancPt = null;
        let snpPts = [];
        let pStep = 0;
        let isCal = false;
        let calRef = {};
        
        let vState = {sc:1, ox:0, oy:0, isD:false, lx:0, ly:0, md:false, mx:0, my:0, snp:null};
        let cState = {x:0, y:0, h:0, s:0, sa:0, th:0};
        let keys = {w:false, a:false, s:false, d:false};
        let pHist = [];
        
        let hist = [], hIdx = -1, skipH = false;
        let advMode = false, advPoints = [], advMouse = null;

        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const wrap = document.getElementById('cv-wrap');
        const ov = document.getElementById('dyn-ov');

        if(window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const genUI = () => {
            const B = [{i:'length',m:15000},{i:'width',m:3000},{i:'wheelbase',m:10000},{i:'rearOverhang',m:4000}];
            const T = [{i:'trailerLength',m:20000},{i:'trailerWheelbase',m:15000},{i:'trailerRearOverhang',m:5000},{i:'hitchOffset',m:2000}];
            const D = [{i:'maxSpeed',m:200},{i:'stampInterval',m:5000}];
            
            const pFn = (arr, c) => arr.map(p => `
                <div class="space-y-0.5">
                    <label class="text-[10px] font-bold text-gray-500 flex justify-between">
                        <span data-i18n="${p.i}"></span>
                        <div class="flex items-center gap-0.5">
                            <input type="number" id="${p.i}-n" class="w-12 bg-transparent text-right font-mono outline-none"/>
                        </div>
                    </label>
                    <input type="range" id="${p.i}-r" max="${p.m}" class="accent-${c}"/>
                </div>
            `).join('');

        const wCrd = e => {

            for(const pt of snpPts){ 
                const wx = cx + (pt.x - dxfD.centerX) * rs, wy = cy - (pt.y - dxfD.centerY) * rs;

        const resetAdvMode = () => {

        const updateAdvUI = () => {

        };

        const genAutoPath = (waypoints, cf) => {
            if(!waypoints || waypoints.length < 2) return null;
            const start = pHist.length ? {...pHist[0], s:0, sa:0, th:pHist[0].th ?? pHist[0].h} : {...cState, s:0, sa:0, th:cState.th ?? cState.h};
            let cur = {...start};
            cur.th = cur.th ?? cur.h;
            const path = [{...cur}];
            const targets = waypoints.map(p => ({x:p.x, y:p.y}));
            let idx = 0;
            const tolerance = Math.max(300, 200) / cf.mmPerPx;
            const minDist = 2 / cf.mmPerPx;
            const speedBase = Math.max(10, Math.min(cf.maxSpeed / 3, cf.maxSpeed / 3));
            let steps = 0;

            while(idx < targets.length && steps < 20000) {
                const target = targets[idx];
                const dx = target.x - cur.x;
                const dy = target.y - cur.y;
                const dist = Math.hypot(dx, dy);
                if(dist <= tolerance) { idx++; continue; }

                const desiredHeading = Math.atan2(dy, dx);
                const headingError = Math.atan2(Math.sin(desiredHeading - cur.h), Math.cos(desiredHeading - cur.h));
                const desiredSteer = Math.max(-cf.maxSteer, Math.min(cf.maxSteer, headingError));
                const steerDiff = desiredSteer - cur.sa;
                cur.sa += Math.sign(steerDiff) * Math.min(cf.steerSpeed, Math.abs(steerDiff));
                cur.sa = Math.max(-cf.maxSteer, Math.min(cf.maxSteer, cur.sa));

                const absError = Math.abs(headingError);
                const turnPenalty = Math.min(1, absError / (Math.PI / 2));
                let speed = Math.max(5, speedBase * (1 - turnPenalty * 0.9));
                const closeDist = dist * cf.mmPerPx;
                if(absError > 0.6) speed = Math.min(speed, 8);
                if(closeDist < 2000) speed = Math.min(speed, Math.max(3, closeDist * 0.15));
                if(idx === targets.length - 1 && closeDist < 3000) speed = Math.min(speed, Math.max(2, closeDist * 0.12));
                const maxStep = Math.max(1, dist * 0.3) * cf.mmPerPx;
                if(speed > maxStep) speed = maxStep;
                cur.s = speed;

                const headingDelta = (cur.s / cf.wheelbase) * Math.tan(cur.sa);
                cur.x += (cur.s / cf.mmPerPx) * Math.cos(cur.h);
                cur.y += (cur.s / cf.mmPerPx) * Math.sin(cur.h);
                cur.h += headingDelta;

                if(cf.hasTrailer) {
                    const hOff = cf.hitchOffset || 0;
                    cur.th += (cur.s * Math.sin(cur.h - cur.th) + hOff * headingDelta * Math.cos(cur.h - cur.th)) / cf.trailerWheelbase;
                    let diff = Math.atan2(Math.sin(cur.h - cur.th), Math.cos(cur.h - cur.th));
                    const maxJackknife = 90 * Math.PI / 180;
                    if(diff > maxJackknife) cur.th = cur.h - maxJackknife;
                    if(diff < -maxJackknife) cur.th = cur.h + maxJackknife;
                } else {
                    cur.th = cur.h;
                }

                const last = path[path.length - 1];
                const moved = Math.hypot(cur.x - last.x, cur.y - last.y) > minDist;
                const headingChanged = Math.abs(cur.h - last.h) > 0.01;
                const trailerChanged = cf.hasTrailer && Math.abs(cur.th - last.th) > 0.01;
                if(moved || headingChanged || trailerChanged) {
                    path.push({...cur});
                }
                steps += 1;
            }
            return path.length > 1 ? path : null;
        };

        const phy = () => {
            if(isCal || pStep > 0) return; 
            const cf = carCfg, st = cState;
            
            if(keys.w) st.s += cf.acceleration; 
            if(keys.s) st.s -= cf.acceleration;
            if(!keys.w && !keys.s){ 
                if(st.s > 0) st.s = Math.max(0, st.s - cf.friction); 
                if(st.s < 0) st.s = Math.min(0, st.s + cf.friction); 
            }
            
            st.s = Math.max(-cf.maxSpeed / 3, Math.min(cf.maxSpeed, st.s));
            
            if(keys.a) st.sa -= cf.steerSpeed; 
            if(keys.d) st.sa += cf.steerSpeed;
            if(!keys.a && !keys.d){ 
                if(st.sa > 0) st.sa = Math.max(0, st.sa - cf.steerSpeed); 
                if(st.sa < 0) st.sa = Math.min(0, st.sa + cf.steerSpeed); 
            }
            st.sa = Math.max(-cf.maxSteer, Math.min(cf.maxSteer, st.sa));
            
            const headingDelta = (st.s / cf.wheelbase) * Math.tan(st.sa);
            st.x += (st.s / cf.mmPerPx) * Math.cos(st.h); 
            st.y += (st.s / cf.mmPerPx) * Math.sin(st.h); 
            st.h += headingDelta;
            
            if(cf.hasTrailer) { 
                const hOff = cf.hitchOffset || 0; 
                st.th += (st.s * Math.sin(st.h - st.th) + hOff * headingDelta * Math.cos(st.h - st.th)) / cf.trailerWheelbase; 
                
                let diff = st.h - st.th;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                const maxJackknife = 90 * Math.PI / 180;
                if (diff > maxJackknife) {
                    st.th = st.h - maxJackknife;
                } else if (diff < -maxJackknife) {
                    st.th = st.h + maxJackknife;
                }
            }
            
            if(Math.abs(st.s) > 0.1){ 
                const lP = pHist[pHist.length - 1];
                const dPx = lP ? Math.hypot(st.x - lP.x, st.y - lP.y) : 100; 
                if(dPx * cf.mmPerPx > 50 || (lP && Math.abs(st.h - lP.h) > 0.017) || (cf.hasTrailer && lP && Math.abs(st.th - lP.th) > 0.017)){ 
                    pHist.push({...st}); 
                    if(pHist.length > 50000) pHist.shift(); 
                } 
            }
        };

        const draw = () => {
            cv.width = wrap.clientWidth; 
            cv.height = wrap.clientHeight; 
            ctx.clearRect(0, 0, cv.width, cv.height); 
            ctx.save(); 
            ctx.translate(vState.ox, vState.oy); 
            ctx.scale(vState.sc, vState.sc); 
            const is = 1 / vState.sc;
            
            if(bgImg){ 
                const sc = Math.min(cv.width / bgImg.width, cv.height / bgImg.height) * 0.9;
                const w = bgImg.width * sc, h = bgImg.height * sc; 
                ctx.globalAlpha = 0.5; 
                ctx.drawImage(bgImg, (cv.width - w) / 2, (cv.height - h) / 2, w, h); 
                ctx.globalAlpha = 1; 
            } else if(dxfD) {
                ctx.save(); 
                ctx.translate(cv.width / 2, cv.height / 2);
                const rS = dxfSc / carCfg.mmPerPx; 
                ctx.scale(rS, -rS); 
                ctx.translate(-dxfD.centerX, -dxfD.centerY);
                
                const drE = (cx, en, bC) => {
                    if(!en) return;
                    let id = en.colorIndex === 256 || en.colorIndex === undefined ? (dxfD.tables?.layer?.layers?.[en.layer]?.colorIndex || 7) : (en.colorIndex === 0 ? bC : en.colorIndex);
                    let co = CLRS.find(c => c.id === id)?.h || '#64748b';
                    if(co === '#ffffff') co = '#334155';
                    
                    if(en.type === 'INSERT' && dxfD.blocks && dxfD.blocks[en.name]){
                        cx.save(); 
                        cx.translate(en.position?.x || 0, en.position?.y || 0);
                        cx.scale(en.scaleX || 1, en.scaleY || 1);
                        if(en.rotation) cx.rotate(en.rotation * Math.PI / 180);
                        if (dxfD.blocks[en.name].entities) {
                            dxfD.blocks[en.name].entities.forEach(e => drE(cx, e, en.colorIndex));
                        }
                        cx.restore();
                    } else if(en.type === 'LINE' && en.vertices && en.vertices.length > 1){
                        cx.beginPath(); 
                        cx.strokeStyle = co; 
                        cx.lineWidth = 1.5 / rS * is;
                        cx.moveTo(en.vertices[0].x, en.vertices[0].y);
                        cx.lineTo(en.vertices[1].x, en.vertices[1].y);
                        cx.stroke();
                    } else if((en.type === 'LWPOLYLINE' || en.type === 'POLYLINE') && en.vertices && en.vertices.length > 0){
                        cx.beginPath(); 
                        cx.strokeStyle = co; 
                        cx.lineWidth = 1.5 / rS * is;
                        cx.moveTo(en.vertices[0].x, en.vertices[0].y);
                        for(let i = 1; i < en.vertices.length; i++) cx.lineTo(en.vertices[i].x, en.vertices[i].y);
                        if(en.shape || en.closed) cx.closePath();
                        cx.stroke();
                    }
                };
                
                if(dxfD.entities) dxfD.entities.forEach(e => drE(ctx, e, 7));
                ctx.restore();
            } else { 
                ctx.strokeStyle = '#e2e8f0'; 
                ctx.lineWidth = is; 
                const g = 40, sx = -vState.ox * is, sy = -vState.oy * is, ex = sx + cv.width * is, ey = sy + cv.height * is; 
                ctx.beginPath(); 
                for(let i = Math.floor(sx / g) * g; i < ex; i += g) { ctx.moveTo(i, sy); ctx.lineTo(i, ey); } 
                for(let i = Math.floor(sy / g) * g; i < ey; i += g) { ctx.moveTo(sx, i); ctx.lineTo(ex, i); } 
                ctx.stroke(); 
            }
            
            if(ancPt){ 
                ctx.strokeStyle = '#2563eb'; 
                ctx.lineWidth = 2 * is; 
                ctx.beginPath(); 
                ctx.moveTo(ancPt.x - 30 * is, ancPt.y); ctx.lineTo(ancPt.x + 30 * is, ancPt.y); 
                ctx.moveTo(ancPt.x, ancPt.y - 30 * is); ctx.lineTo(ancPt.x, ancPt.y + 30 * is); 
                ctx.stroke(); 
                ctx.beginPath(); 
                ctx.arc(ancPt.x, ancPt.y, 15 * is, 0, Math.PI * 2); 
                ctx.stroke(); 
            }

            if(advMode && advPoints.length){
                ctx.strokeStyle = '#7c3aed';
                ctx.lineWidth = 2 * is;
                ctx.setLineDash([10 * is, 8 * is]);
                ctx.beginPath();
                advPoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                if(advMouse){ ctx.lineTo(advMouse.x, advMouse.y); }
                ctx.stroke();
                ctx.setLineDash([]);
                advPoints.forEach(p => {
                    ctx.fillStyle = '#7c3aed';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6 * is, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1 * is;
                    ctx.stroke();
                });
                if(advMouse){
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(advMouse.x, advMouse.y, 5 * is, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#7c3aed';
                    ctx.lineWidth = 1 * is;
                    ctx.stroke();
                }
            }
            
            if(vState.snp && (pStep > 0 || isCal)){ 
                ctx.strokeStyle = '#f59e0b'; 
                ctx.lineWidth = 2 * is; 
                const sz = 16 * is; 
                ctx.strokeRect(vState.snp.x - sz / 2, vState.snp.y - sz / 2, sz, sz); 
            }
            
            if(isCal && calRef.step >= 1 && calRef.p1){ 
                ctx.fillStyle = '#f59e0b'; 
                ctx.beginPath(); 
                ctx.arc(calRef.p1.x, calRef.p1.y, 5 * is, 0, Math.PI * 2); 
                ctx.fill(); 
                if(calRef.mouse){ 
                    ctx.beginPath(); 
                    ctx.moveTo(calRef.p1.x, calRef.p1.y); ctx.lineTo(calRef.mouse.x, calRef.mouse.y); 
                    ctx.strokeStyle = '#f59e0b'; 
                    ctx.lineWidth = 2 * is; 
                    ctx.stroke(); 
                    ctx.beginPath(); 
                    ctx.arc(calRef.mouse.x, calRef.mouse.y, 5 * is, 0, Math.PI * 2); 
                    ctx.fill(); 
                } 
            }
            
            const gCr = (x, y, a, f, b, l, r) => { 
                const c = Math.cos(a), s = Math.sin(a); 
                return [
                    {x: x + f * c - l * s, y: y + f * s + l * c},
                    {x: x + f * c - r * s, y: y + f * s + r * c},
                    {x: x + b * c - r * s, y: y + b * s + r * c},
                    {x: x + b * c - l * s, y: y + b * s + l * c}
                ]; 
            };
            
            const dTr = (ph, cf, cId, isC) => { 
                if(!ph.length) return; 
                const hc = CLRS.find(c => c.id === cId).h; 
                ctx.strokeStyle = hc; 
                ctx.globalAlpha = isC ? 0.8 : 0.4; 
                ctx.lineWidth = 1 * is; 
                ctx.beginPath(); 
                ph.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); 
                ctx.stroke(); 
                
                const fl = [], fr = [], rl = [], rr = [], tfl = [], tfr = [], trl = [], trr = [];
                ph.forEach(p => {
                    const cs = Math.cos(p.h), sn = Math.sin(p.h), f = (cf.length - cf.rearOverhang) / cf.mmPerPx, b = -cf.rearOverhang / cf.mmPerPx, w = cf.width / 2 / cf.mmPerPx;
                    fl.push({x: p.x + f * cs - w * sn, y: p.y + f * sn + w * cs}); 
                    fr.push({x: p.x + f * cs + w * sn, y: p.y + f * sn - w * cs});
                    rl.push({x: p.x + b * cs - w * sn, y: p.y + b * sn + w * cs}); 
                    rr.push({x: p.x + b * cs + w * sn, y: p.y + b * sn - w * cs});
                    if(cf.hasTrailer){
                        const tcs = Math.cos(p.th), tsn = Math.sin(p.th), hx = p.x + (cf.hitchOffset || 0) / cf.mmPerPx * cs, hy = p.y + (cf.hitchOffset || 0) / cf.mmPerPx * sn;
                        const tf = (cf.trailerFrontOverhang || 1215) / cf.mmPerPx, tb = tf - cf.trailerLength / cf.mmPerPx, tw = cf.trailerWidth / 2 / cf.mmPerPx;
                        tfl.push({x: hx + tf * tcs - tw * tsn, y: hy + tf * tsn + tw * tcs}); 
                        tfr.push({x: hx + tf * tcs + tw * tsn, y: hy + tf * tsn - tw * tcs});
                        trl.push({x: hx + tb * tcs - tw * tsn, y: hy + tb * tsn + tw * tcs}); 
                        trr.push({x: hx + tb * tcs + tw * tsn, y: hy + tb * tsn - tw * tcs});
                    }
                });
                
                const dL = a => { ctx.beginPath(); a.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); ctx.stroke(); };

                        const p = vState.snp || wCrd(e); 
                        const last = advPoints[advPoints.length - 1];
                        if(last && Math.hypot(last.x - p.x, last.y - p.y) < 5) return;
                        advPoints.push(p); updUI(); return; 
                    }
                    ck(e);
                }
                wrap.classList.remove('active:cursor-grabbing'); 
            };
            cv.onmouseleave = () => { vState.isD = false; wrap.classList.remove('active:cursor-grabbing'); }; 
            cv.oncontextmenu = e => e.preventDefault();
            cv.onwheel = e => { 
                e.preventDefault(); 
                const d = -e.deltaY * 0.0015, ns = Math.max(0.01, Math.min(vState.sc * Math.exp(d), 300));
                const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; 
                vState.ox = mx - (mx - vState.ox) * (ns / vState.sc); 
                vState.oy = my - (my - vState.oy) * (ns / vState.sc); 
                vState.sc = ns; 
            };
            window.onkeydown = e => { 
                const k = e.key.toLowerCase(); 
                if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ 
                    if(isCal || pStep > 0) return; 
                    e.preventDefault(); 
                    if(k === 'w' || k === 'arrowup') keys.w = true; 
                    if(k === 'a' || k === 'arrowleft') keys.a = true; 
                    if(k === 's' || k === 'arrowdown') keys.s = true; 
                    if(k === 'd' || k === 'arrowright') keys.d = true; 
                } 
            };
            window.onkeyup = e => { 
                const k = e.key.toLowerCase(); 
                if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ 
                    e.preventDefault(); 
                    if(k === 'w' || k === 'arrowup') keys.w = false; 
                    if(k === 'a' || k === 'arrowleft') keys.a = false; 
                    if(k === 's' || k === 'arrowdown') keys.s = false; 
                    if(k === 'd' || k === 'arrowright') keys.d = false; 
                } 
            };
            window.onresize = () => { cv.width = wrap.clientWidth; cv.height = wrap.clientHeight; }; 
            window.onresize(); 
            updLang(); 
            document.getElementById('preset').value = 'car'; 
            document.getElementById('preset').dispatchEvent(new Event('change')); 
            
            svH(); // Initialize history
            requestAnimationFrame(loop);
        };

        window.onload = init;
    </script>
